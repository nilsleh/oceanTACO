name: Generator tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install generator test dependencies
        run: python -m pip install -e ".[generate,tests]"

      - name: Lint generator code
        run: ruff check ocean_taco/generate_dataset tests/generate_dataset

      - name: Run generator regression tests
        run: pytest -q tests/generate_dataset
