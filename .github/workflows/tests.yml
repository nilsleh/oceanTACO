name: Tests

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match `requires-python` in pyproject.toml.
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests]"

      # Scoped to the shipped package and tests: generate_dataset/ and the
      # dev scripts carry ~650 pre-existing findings, and gating this PR check
      # on that backlog would block every unrelated change. Widen the paths as
      # those directories are cleaned up.
      - name: Lint shipped surface
        continue-on-error: true
        run: |
          ruff check --no-fix \
            ocean_taco/access ocean_taco/render ocean_taco/sampling ocean_taco/torch \
            ocean_taco/__init__.py ocean_taco/catalog.py ocean_taco/filter.py \
            ocean_taco/geobox.py ocean_taco/manifest.py ocean_taco/registry.py \
            ocean_taco/retrieve.py ocean_taco/temporal.py \
            tests

      - name: Run offline test suite
        # The default addopts deselect `slow`, so this stays network-free.
        run: pytest tests -q
