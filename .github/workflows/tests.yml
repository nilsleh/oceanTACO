name: Tests

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match `requires-python` in pyproject.toml.
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,viz]"

      # Scoped to the shipped package and tests. The repository-only code in
      # tools/ and the dev scripts carry ~650 pre-existing findings, and gating
      # this PR check on that backlog would block every unrelated change.
      - name: Lint shipped surface
        run: ruff check --no-fix ocean_taco tests

      - name: Run offline test suite
        # The default addopts deselect `slow`, so this stays network-free.
        run: pytest tests -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build documentation with warnings as errors
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,viz]"
          sphinx-build -W -b html docs docs/_build/html
