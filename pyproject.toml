[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "oceantaco"
version = "0.1.0"
description = "Reproducible native-coordinate ocean retrieval and sampling"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nils Lehmann", email = "n.lehmann@tum.de" }]
maintainers = [{ name = "Nils Lehmann", email = "n.lehmann@tum.de" }]
keywords = ["climate", "assimilation", "earth-observation", "altimetry", "dataset", "ocean", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "torch>=2.2",
    "tqdm>=4.66",
    "xarray>=2025.11.0",
    "pyarrow>=16",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "cartopy>=0.23.0",
    "matplotlib>=3.10",
    "tacoreader>=2.4.20",
    "scipy>=1.12",
    "shapely>=2.0",
    "omegaconf>=2.3",
    "pydantic>=2.12.5",
    "typer>=0.12",
    "rich>=13.0",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "huggingface_hub>=0.24"
]

[project.optional-dependencies]
hf = [
    "datasets>=2.19",
]
materialize = [
    "dask[array]>=2024.10",
]
generate = [
    "argopy",
    "copernicusmarine>=2.2.1",
    "tacotoolbox>=0.26.1",
]
tests = [
    "pytest>=8.0",
    "ruff>=0.9",
]
docs = [
    "sphinx>=7.4",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
]
benchmarks = [
    "zarr>=2.18",
]
viz = [
    "matplotlib>=3.10",
    "cartopy>=0.23.0",
]
tutorials = [
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[project.urls]
Homepage = "https://github.com/nilsleh/oceanTACO"
Documentation = "https://oceantaco.readthedocs.io/en/latest/"
Repository = "https://github.com/nilsleh/oceanTACO"
Issues = "https://github.com/nilsleh/oceanTACO/issues"

[tool.uv.build-backend]
# The package sits at the repository root rather than under `src/`, and the
# distribution is `oceantaco` while the import package is `ocean_taco`, so the
# backend can derive neither from the other. These two keys are the whole
# packaging configuration: `ocean_taco/` is the wheel verbatim, and any future
# need for an exclusion rule means repository-only code has crept into it.
module-root = ""
module-name = "ocean_taco"

[tool.pytest.ini_options]
addopts = "-m 'not slow and not remote'"
filterwarnings = []
markers = [
    "slow: marks tests as slow (requires network access; deselected by default)",
    "local: marks tests that require the guarded local OceanTACO port (skipped when absent)",
    "remote: marks tests that exercise the HuggingFace remote path (deselected by default)",
    "workers: marks high-value worker-boundary regression tests",
]

[tool.env]
USE_IOMP = "0"

[tool.mypy]
ignore_missing_imports = true
exclude = "(dist|docs|requirements|.*egg-info)/"

[tool.ruff]
extend-include = ["*.ipynb"]
fix = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["D", "I", "UP"]
extend-ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["D"]
"tests/**" = ["D"]
"**/test_*.py" = ["D"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
