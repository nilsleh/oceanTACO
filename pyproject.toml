[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean_taco"
version = "0.1.0"
description = "Reproducible native-coordinate ocean retrieval and sampling"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nils Lehmann", email = "n.lehmann@tum.de" }]
maintainers = [{ name = "Nils Lehmann", email = "n.lehmann@tum.de" }]
keywords = ["climate", "assimilation", "earth-observation", "altimetry", "dataset", "ocean", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "requests>=2.31",
    "torch>=2.2",
    "xarray>=2024.10",
    "pyarrow>=16",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "tacoreader>=2.4.20,<3",
    "scipy>=1.12"
]

[project.optional-dependencies]
hf = [
    "datasets>=2.19",
    "huggingface_hub>=0.24",
]
materialize = [
    "dask[array]>=2024.10",
]
tests = [
    "pytest>=8.0",
    "ruff>=0.9",
]
docs = [
    "sphinx>=7.4",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
]
viz = [
    "matplotlib>=3.10",
    "cartopy>=0.23.0",
]
tutorials = [
    "jupyterlab>=4.0",
    "nbclient>=0.10",
]

[project.urls]
Repository = "https://github.com/nilsleh/oceanTACO"
Issues = "https://github.com/nilsleh/oceanTACO/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
# Search from repo root (.) and include the ocean_taco package
where = ["."]
include = ["ocean_taco*"]
exclude = [
    "ocean_taco.benchmarks*",
    "ocean_taco.dataset*",
    "ocean_taco.generate_dataset*",
    "ocean_taco.viz*",
    "ocean_taco.test*",
    "tests*",
]

[tool.setuptools.package-data]
ocean_taco = ["py.typed", "sampling/data/*.npz"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
filterwarnings = []
markers = [
    "slow: marks tests as slow (requires network access; deselected by default)",
    "local: marks tests that require the guarded local OceanTACO port (skipped when absent)",
]

[tool.env]
USE_IOMP = "0"

[tool.mypy]
ignore_missing_imports = true
exclude = "(dist|docs|requirements|.*egg-info)/"

[tool.ruff]
extend-include = ["*.ipynb"]
fix = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = ["D", "I", "UP"]
extend-ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["D"]
"tests/**" = ["D"]
"**/test_*.py" = ["D"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
